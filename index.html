<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple form hosting proof of concept.">
  <title>Form POC</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
    main { width: min(100%, 620px); }
    .eyebrow { margin: 0 0 10px; color: #53627a; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 2.7rem); letter-spacing: -.045em; }
    .intro { margin: 12px 0 26px; color: #58657a; line-height: 1.6; }
    .card { padding: clamp(22px, 5vw, 36px); background: #fff; border: 1px solid #e2e7ef; border-radius: 18px; box-shadow: 0 18px 55px #25385812; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    label { display: block; margin: 0 0 7px; color: #29364b; font-size: .9rem; font-weight: 650; }
    .field { margin-bottom: 18px; }
    input, select, textarea { width: 100%; border: 1px solid #cbd4e1; border-radius: 9px; padding: 12px 13px; color: #172033; background: #fff; font: inherit; }
    input:focus, select:focus, textarea:focus { outline: 3px solid #d8e5ff; border-color: #4975cf; }
    textarea { min-height: 132px; resize: vertical; }
    button { border: 0; border-radius: 9px; padding: 13px 19px; color: white; background: #2457b2; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #194793; }
    .note { margin: 18px 0 0; color: #6b778b; font-size: .82rem; line-height: 1.5; }
    #status { margin: 16px 0 0; color: #17623a; font-weight: 650; }
    #status:empty { display: none; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; gap: 0; } body { padding: 26px 16px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Proof of concept</p>
    <h1>Get in touch</h1>
    <p class="intro">A sample form page hosted as a static site on GitHub Pages. Replace these fields with the final form when it’s ready.</p>
    <section class="card" aria-label="Contact form">
      <form id="contact-form">
        <div class="grid">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
        </div>
        <div class="field">
          <label for="topic">Topic</label>
          <select id="topic" name="topic" required>
            <option value="">Choose a topic</option>
            <option>General enquiry</option>
            <option>Request a demo</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Send message</button>
        <p id="status" role="status" aria-live="polite"></p>
        <p class="note">POC only: this demo shows a confirmation in your browser. It does not send or save form responses.</p>
      </form>
    </section>
  </main>
  <script>
    document.getElementById("contact-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("status").textContent = "Thanks — the demo form is working.";
      event.currentTarget.reset();
    });
  </script>
</body>
</html>
